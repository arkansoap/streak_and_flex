# nginx de prod : SPA React + reverse proxy vers gunicorn. Le TLS est géré par le
# reverse proxy de la machine (Caddy / nginx hôte), pas ici.
#
# Protection par mot de passe HTTP basique sur tout le site (fichier htpasswd monté
# par docker-compose.prod.yml). Seul /api/health reste ouvert pour la supervision.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Streak & Flex";
    auth_basic_user_file /etc/nginx/htpasswd;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/health {
        auth_basic off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
